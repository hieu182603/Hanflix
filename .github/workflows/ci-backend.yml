name: CI Backend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-backend.yml'

# Cancel in-flight runs of this workflow on the same branch/ref when a new
# commit is pushed. Saves CI minutes on rapid-fire pushes to a PR.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

# Restrict default token permissions and explicitly grant what's needed.
permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Unit & integration tests should not require a running MongoDB or any
      # external service. Tests that hit the network should be tagged or
      # gated so this job stays fast and reliable.
      - name: Run vitest
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/hanflix-test
          JWT_ACCESS_SECRET: 01234567890123456789012345678901
          JWT_REFRESH_SECRET: abcdefghijklmnopqrstuvwxyzabcdef
          REDIS_URL: redis://127.0.0.1:6379
          GEMINI_API_KEY: test-gemini-api-key

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  subscription-integration:
    name: Premium lifecycle (MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify trial, payment races and migration
        run: npm test -- src/services/subscription.integration.test.ts src/services/billing.integration.test.ts --maxWorkers=2
        env:
          SUBSCRIPTION_TEST_MONGODB_URI: mongodb://127.0.0.1:27017
          BILLING_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [typecheck, test, subscription-integration]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile TypeScript
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  docker-smoke:
    name: Docker smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      # Smoke test only — guarantees the Dockerfile keeps compiling after
      # changes. Full multi-arch publish happens in release.yml.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: hanflix-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.actor != 'dependabot[bot]' && 'type=gha,mode=max' || '' }}
