name: CodeQL Security Analysis

# GitHub's built-in SAST scanner for JavaScript / TypeScript. Runs weekly to
# catch newly-discovered vulnerabilities in our own code, plus on every PR
# that changes backend or frontend source.

on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            paths: frontend/src
          - language: javascript-typescript
            paths: backend/src
    steps:
      - uses: actions/checkout@v4

      # Initialize CodeQL with the languages we care about
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 'security-and-quality' includes additional taint / dataflow rules
          # beyond 'security' — better coverage at the cost of slightly more
          # false positives.
          queries: security-and-quality
          paths: ${{ matrix.paths }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          upload: 'never'
