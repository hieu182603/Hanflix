# Compose file for running HanFlix locally with Docker.
#
# Layout:
#   - backend: Node 22 API on internal port 4000
#   - frontend: Nginx-served SPA on port 80
#
# The frontend proxies /api/* to the backend container so the SPA can be
# built with VITE_API_BASE_URL=/api and stay origin-relative in production.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hanflix-backend:local
    container_name: hanflix-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # Connection strings come from the host environment via the `.env` file
      # in the same directory as this compose file. Never commit secrets.
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - hanflix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The backend mounts everything under env.API_PREFIX (default /api/v1),
        # so the SPA must call /api/v1/* — Nginx then reverse-proxies /api/*
        # upstream to the backend service.
        VITE_API_BASE_URL: /api/v1
    image: hanflix-frontend:local
    container_name: hanflix-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - hanflix-net

networks:
  hanflix-net:
    driver: bridge
