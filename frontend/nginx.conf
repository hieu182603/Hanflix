# nginx config for serving the built HanFlix SPA.
#
# SPA fallback: any path that doesn't match a static file under /assets
# or an explicit route falls through to /index.html so React Router can
# handle client-side routing. This is critical because users now navigate
# to URLs like /lessons, /admin/videos, /admin/editor/<id>, /watch/<id> —
# reloading any of them must serve index.html, not 404.
#
# Static asset caching: everything under /assets/* gets a 1-year immutable
# cache because Vite emits content-hashed filenames (e.g. index-Be-3RRLo.js).
# index.html itself is `no-cache` so deploys are picked up immediately.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip text-based assets — Vite already compresses but nginx can compress
    # on-the-fly for any text the browser requests (e.g. svg).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long-lived immutable cache for Vite-hashed asset bundles
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — must come last so static asset locations above still win.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container. The backend mounts
    # routes under env.API_PREFIX (default `/api/v1`). We forward `/api/` to
    # the upstream keeping the prefix intact so /api/v1/notifications reaches
    # the right handler.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health probe for orchestrators
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Don't let nginx serve dotfiles if any sneak in (e.g. .env)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
